services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: smartfin-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartfin-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # 2. Frontend Static Site (React + Vite)
  - type: static
    name: smartfin-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API
        fromService:
          type: web
          name: smartfin-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database (Free tier)
  - name: smartfin-postgres
    plan: free
    region: oregon
    databaseName: smartfin
    user: smartfin
